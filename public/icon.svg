<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Orbital Ring 1 (Rotated 45deg) -->
  <ellipse cx="256" cy="256" rx="175" ry="68" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" transform="rotate(45 256 256)" filter="url(#glow)" opacity="0.9"/>

  <!-- Orbital Ring 2 (Rotated -45deg) -->
  <ellipse cx="256" cy="256" rx="175" ry="68" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" transform="rotate(-45 256 256)" filter="url(#glow)" opacity="0.9"/>

  <!-- Orbital Ring 3 (Horizontal) -->
  <ellipse cx="256" cy="256" rx="170" ry="60" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="8 12" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>

  <!-- Central Quantum Core Aura -->
  <circle cx="256" cy="256" r="64" fill="url(#glowGrad)" filter="url(#softGlow)" opacity="0.45"/>
  <circle cx="256" cy="256" r="44" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff" opacity="0.95"/>

  <!-- Quantum Nodes on Orbits -->
  <circle cx="132" cy="132" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="380" cy="380" r="16" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="380" cy="132" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="132" cy="380" r="14" fill="#818cf8" filter="url(#glow)"/>

  <!-- Direct Quantum Connection Links -->
  <line x1="132" y1="132" x2="256" y2="256" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 6" opacity="0.7"/>
  <line x1="380" y1="380" x2="256" y2="256" stroke="#a855f7" stroke-width="3" stroke-dasharray="4 6" opacity="0.7"/>
</svg>
