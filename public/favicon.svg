<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Primary Quantum Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Secondary Entanglement Indigo/Purple Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Emerald Telemetry Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Radial Core Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Inner Ambient Quantum Field Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)"/>

  <!-- Coordinate Grid & Precision Targeting Crosshairs -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="2">
    <!-- Corner brackets -->
    <path d="M 72 110 L 72 72 L 110 72" fill="none" stroke-linecap="round"/>
    <path d="M 440 110 L 440 72 L 402 72" fill="none" stroke-linecap="round"/>
    <path d="M 72 402 L 72 440 L 110 440" fill="none" stroke-linecap="round"/>
    <path d="M 440 402 L 440 440 L 402 440" fill="none" stroke-linecap="round"/>
    <!-- Subtle center axes -->
    <line x1="256" y1="52" x2="256" y2="76" stroke-linecap="round"/>
    <line x1="256" y1="436" x2="256" y2="460" stroke-linecap="round"/>
    <line x1="52" y1="256" x2="76" y2="256" stroke-linecap="round"/>
    <line x1="436" y1="256" x2="460" y2="256" stroke-linecap="round"/>
  </g>

  <!-- Orbital Quantum Rings (Wave Functions) -->
  <g fill="none" stroke-linecap="round">
    <!-- Diagonal Ring 1 (Cyan - 45deg) -->
    <ellipse cx="256" cy="256" rx="180" ry="68" transform="rotate(-45 256 256)" 
             stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="260 20 60 20" opacity="0.75"/>
    
    <!-- Diagonal Ring 2 (Indigo - 45deg opposite) -->
    <ellipse cx="256" cy="256" rx="180" ry="68" transform="rotate(45 256 256)" 
             stroke="url(#indigoGrad)" stroke-width="8" stroke-dasharray="220 30 70 20" opacity="0.75"/>
  </g>

  <!-- Orbiting Photons / Data Packets on the Ellipses -->
  <g>
    <!-- Cyan photon -->
    <circle cx="128" cy="128" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="128" cy="128" r="4" fill="#ffffff"/>
    
    <!-- Violet photon -->
    <circle cx="384" cy="128" r="8" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="384" cy="128" r="4" fill="#ffffff"/>

    <!-- Green telemetry pulse -->
    <circle cx="384" cy="384" r="7" fill="#34d399" filter="url(#glow)"/>
    <circle cx="384" cy="384" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Center Quantum Interlocking Link Core -->
  <!-- Left Link Loop (Cyan) -->
  <g filter="url(#glow)">
    <path d="M 215 175 
             C 170 175, 135 210, 135 256 
             C 135 302, 170 337, 215 337 
             L 245 337 
             C 255 337, 264 329, 264 319 
             C 264 309, 255 301, 245 301 
             L 215 301 
             C 190 301, 171 281, 171 256 
             C 171 231, 190 211, 215 211 
             L 255 211 
             C 265 211, 273 203, 273 193 
             C 273 183, 265 175, 255 175 
             Z" 
          fill="url(#cyanGrad)"/>

    <!-- Right Link Loop (Indigo/Violet) - Intertwined -->
    <path d="M 297 337 
             C 342 337, 377 302, 377 256 
             C 377 210, 342 175, 297 175 
             L 267 175 
             C 257 175, 248 183, 248 193 
             C 248 203, 257 211, 267 211 
             L 297 211 
             C 322 211, 341 231, 341 256 
             C 341 281, 322 301, 297 301 
             L 257 301 
             C 247 301, 239 309, 239 319 
             C 239 329, 247 337, 257 337 
             Z" 
          fill="url(#indigoGrad)"/>
  </g>

  <!-- Central Quantum Entanglement Bridge & Nexus Spark -->
  <g filter="url(#coreGlow)">
    <!-- Central Beam Line -->
    <line x1="225" y1="256" x2="287" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Central Diamond Energy Spark -->
    <path d="M 256 236 L 268 256 L 256 276 L 244 256 Z" fill="#ffffff"/>
    <circle cx="256" cy="256" r="4" fill="#00f0ff"/>
  </g>

  <!-- P2P Connected Terminal Dots (Handshake Vertices) -->
  <circle cx="215" cy="256" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="215" cy="256" r="3" fill="#ffffff"/>
  
  <circle cx="297" cy="256" r="6" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="297" cy="256" r="3" fill="#ffffff"/>
</svg>
